name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r typecheck

      - name: unit tests
        run: pnpm -r --filter "@chalkboard/shared" --filter "@chalkboard/whiteboard" --filter "@chalkboard/llm" --filter "@chalkboard/renderer" --filter "@chalkboard/narration" test

      - name: format check
        run: pnpm format:check

  smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'smoke')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: install playwright chromium
        run: pnpm --filter @chalkboard/renderer exec playwright install --with-deps chromium

      - name: end-to-end smoke (stub providers)
        run: pnpm --filter @chalkboard/core smoke

      - name: artifact (mp4)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-output
          path: packages/core/core-smoke.mp4
          if-no-files-found: ignore
