<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chalkboard render</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fafafa;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #canvas-host {
        background: #fafafa;
        box-shadow: 0 0 0 0 transparent;
        position: relative;
      }
      .excalidraw {
        --color-primary: #1e1e1e;
      }
      .excalidraw .App-toolbar,
      .excalidraw .App-bottom-bar,
      .excalidraw .App-menu,
      .excalidraw .App-toolbar-content,
      .excalidraw .layer-ui__wrapper,
      .excalidraw .undo-redo-buttons,
      .excalidraw .zoom-actions,
      .excalidraw .scroll-back-to-content,
      .excalidraw .help-icon,
      .excalidraw .welcome-screen-container {
        display: none !important;
      }
      .excalidraw .excalidraw-container,
      .excalidraw .Island {
        background: #fafafa !important;
      }
    </style>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.css"
    />
    <script src="https://unpkg.com/@excalidraw/excalidraw@0.17.6/dist/excalidraw.production.min.js"></script>
  </head>
  <body>
    <div id="stage">
      <div id="canvas-host"></div>
    </div>
    <script type="module" src="./player.js"></script>
  </body>
</html>
