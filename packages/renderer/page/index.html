<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>chalkboard render</title>
    <style>
      :root {
        --paper: #fafafa;
        --ink: #1e1e1e;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--paper);
        overflow: hidden;
        font-family:
          'Virgil', 'Comic Sans MS', 'Segoe Print', cursive, system-ui,
          sans-serif;
        color: var(--ink);
      }
      #stage {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #canvas {
        background: var(--paper);
        display: block;
      }
      /* Excalidraw Virgil font — loaded so headless Chromium renders the
         hand-drawn look without needing a system font. */
      @font-face {
        font-family: 'Virgil';
        font-style: normal;
        font-weight: 400;
        font-display: block;
        src:
          local('Virgil'),
          url('https://excalidraw.com/Virgil.woff2') format('woff2');
      }
    </style>
    <script src="https://unpkg.com/roughjs@4.6.6/bundled/rough.js"></script>
  </head>
  <body>
    <div id="stage">
      <canvas id="canvas" width="1920" height="1080"></canvas>
    </div>
    <script src="./player.js"></script>
  </body>
</html>
